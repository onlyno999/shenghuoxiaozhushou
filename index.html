<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常小工具</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<header>
  <h1>日常小工具</h1>
  <p>几个自用的小页面，打开就能用。</p>
</header>
<main>
  <section class="card">
    <h2>单位换算</h2>
    <label>数值 <input id="convValue" type="number" value="1"></label>
    <label>从
      <select id="convFrom">
        <option value="km">千米</option>
        <option value="m" selected>米</option>
        <option value="cm">厘米</option>
        <option value="kg">千克</option>
        <option value="g">克</option>
        <option value="jin">斤</option>
      </select>
    </label>
    <label>到
      <select id="convTo">
        <option value="km">千米</option>
        <option value="m">米</option>
        <option value="cm" selected>厘米</option>
        <option value="kg">千克</option>
        <option value="g">克</option>
        <option value="jin">斤</option>
      </select>
    </label>
    <p class="result" id="convResult">-</p>
  </section>
  <section class="card">
    <h2>BMI 计算</h2>
    <label>身高（厘米）<input id="bmiHeight" type="number" value="170"></label>
    <label>体重（千克）<input id="bmiWeight" type="number" value="65"></label>
    <p class="result" id="bmiResult">-</p>
  </section>
  <section class="card">
    <h2>待办清单</h2>
    <div class="todo-row">
      <input id="todoInput" type="text" placeholder="写点什么，回车添加">
      <button id="todoAdd">添加</button>
    </div>
    <ul id="todoList"></ul>
  </section>
</main>
<footer>
  <a href="about.html">关于</a>
</footer>
<script src="app.js"></script>
</body>
</html>
